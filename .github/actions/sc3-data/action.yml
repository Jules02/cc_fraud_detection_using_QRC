name: sc3-data
description: >
  Install the project (with CPU torch) and regenerate data/sc3_c1000_x6 with the recipe of its README, checked
  against the fingerprint of the shared local copy (sha256 of the CSV text of the columns used).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install the project and CPU torch
      shell: bash
      run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e .
    - name: Generate data/sc3_c1000_x6
      shell: bash
      run: |
        python - <<'EOF'
        from qrc.datasets.create_dataset import run_simulation
        from qrc.datasets.split_dataset import main as split_and_save
        customers, terminals, tx = run_simulation(
            n_customers=1000, n_terminals=10000, nb_days=365, start_date="2025-01-01", r=5,
            n_compromised_customers=6, output_dir="data/sc3_c1000_x6/raw",
        )
        split_and_save(tx, validation_start="2025-09-13", test_start="2025-11-06", output_dir="data/sc3_c1000_x6")
        EOF
    - name: Check the data against the local copy
      shell: bash
      run: |
        python - <<'EOF'
        import hashlib
        import pandas as pd
        expected = {"train": (483807, "0b3c2f2bb2833c8f"), "validation": (102003, "be4bd22b70a35d0a"),
                    "test": (106153, "72a367848b712704")}
        for split, (n, fingerprint) in expected.items():
            df = pd.read_pickle(f"data/sc3_c1000_x6/transactions_{split}.pkl").reset_index(drop=True)
            df = df[["TX_DATETIME", "CUSTOMER_ID", "TERMINAL_ID", "TX_AMOUNT", "TX_FRAUD", "TX_FRAUD_SCENARIO"]].astype(
                {"CUSTOMER_ID": "int64", "TERMINAL_ID": "int64", "TX_AMOUNT": "float64"})
            got = (len(df), hashlib.sha256(df.to_csv(index=False, float_format="%.6f").encode()).hexdigest()[:16])
            assert got == (n, fingerprint), f"{split}: {got} != {(n, fingerprint)}"
            print(split, "ok")
        EOF
