name: tuned_3

# Equal-budget tuning of results/3_tuned/tuned.py: TFIM (2 Trotter steps, XYZ-strings) vs ESN-45 at L = 15, 100 Optuna
# trials each. The TFIM study (~4-5 min per trial) runs in up to three chained jobs of at most ~5 h each, every job
# resuming from the previous one's study database; the ESN study fits in one job. Then the best setting of each is
# evaluated on seeds 42-51 and everything is merged into one artifact. Then, locally:
#   gh run download <run-id> -R Jules02/cc_fraud_detection_using_QRC -n tuned3-results -D results/3_tuned

on:
  push:
    branches: [fraud-2]
    paths: [.github/workflows/tuned_3.yml, results/3_tuned/tuned.py]
  workflow_dispatch:

env:
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1
  PYTHONPATH: .

jobs:
  tune-esn:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sc3-data
      - run: python results/3_tuned/tuned.py tune --model esn --max-minutes 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-esn
          path: results/3_tuned/study_esn.db

  tune-tfim-1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sc3-data
      - run: python results/3_tuned/tuned.py tune --model tfim --max-minutes 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-tfim-1
          path: results/3_tuned/study_tfim.db

  tune-tfim-2:
    needs: tune-tfim-1
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: study-tfim-1
          path: results/3_tuned
      - uses: ./.github/actions/sc3-data
      - run: python results/3_tuned/tuned.py tune --model tfim --max-minutes 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-tfim-2
          path: results/3_tuned/study_tfim.db

  tune-tfim-3:
    needs: tune-tfim-2
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: study-tfim-2
          path: results/3_tuned
      - uses: ./.github/actions/sc3-data
      - run: python results/3_tuned/tuned.py tune --model tfim --max-minutes 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-tfim-3
          path: results/3_tuned/study_tfim.db

  evaluate:
    needs: [tune-esn, tune-tfim-3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: [tfim, esn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.model == 'tfim' && 'study-tfim-3' || 'study-esn' }}
          path: results/3_tuned
      - uses: ./.github/actions/sc3-data
      - name: Evaluate the best setting on seeds 42-51
        run: |
          seq 42 51 | xargs -P 4 -I{} sh -c 'python results/3_tuned/tuned.py evaluate --model ${{ matrix.model }} --seed {} >> results/3_tuned/evaluate_${{ matrix.model }}.log 2>&1 || echo "FAILED: seed {}" >> results/3_tuned/errors_${{ matrix.model }}.log'
          if [ -s results/3_tuned/errors_${{ matrix.model }}.log ]; then cat results/3_tuned/errors_${{ matrix.model }}.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.model }}
          path: |
            results/3_tuned/runs/
            results/3_tuned/study_${{ matrix.model }}.db
            results/3_tuned/*_${{ matrix.model }}.log

  merge:
    needs: evaluate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          merge-multiple: true
          path: results/
      - run: ls results/runs/*.json | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: tuned3-results
          path: results/
